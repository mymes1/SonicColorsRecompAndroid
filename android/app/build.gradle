plugins { id 'com.android.application' }

android {
    namespace 'org.soniccolorsrecomp.android'
    compileSdk 35
    buildFeatures { buildConfig true }
    ndkVersion '26.3.11579264'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    defaultConfig {
        applicationId 'org.soniccolorsrecomp.android'
        buildConfigField 'boolean', 'RECOMP_INCLUDED', project.findProperty('compileGenerated') == 'true' ? 'true' : 'false'
        // arm64 only for what ships: the guest-thread fiber switch is AArch64 assembly
        // (runtime/platform/android/fiber.cpp), and src/main/cpp/CMakeLists.txt refuses any ABI it
        // has no switch for. The instrumentation job passes -PtestAbis=true to add x86_64, because
        // a hosted runner can only start an x86_64 emulator.
        ndk { abiFilters((project.findProperty('testAbis') == 'true'
                ? ['arm64-v8a', 'x86_64'] : ['arm64-v8a']) as String[]) }
        externalNativeBuild {
            cmake { arguments "-DSCR_COMPILE_GENERATED=${project.findProperty('compileGenerated') == 'true' ? 'ON' : 'OFF'}" }
        }
        // Android 8.0. Rendering needs Vulkan (API 24) and audio needs AAudio (API 26); the
        // runtime has no fallback for either, so declaring less would only produce an APK that
        // installs on old devices and then fails to render or play anything.
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
}

 dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
