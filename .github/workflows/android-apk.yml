name: Android launcher preview APK
on:
  workflow_dispatch:
    inputs:
      prepare_game:
        description: 'Recompile owned disc into a private, non-playable APK'
        type: boolean
        default: false
        required: true
  push:
    paths: ['android/**', 'runtime/platform/android/**', 'runtime/cpu/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', 'runtime/platform/android/**', 'runtime/cpu/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native build dependencies
        run: sdkmanager 'platforms;android-35' 'ndk;26.3.11579264' 'cmake;3.22.1'
      # shaderc is not shipped prebuilt in the NDK; Google's guide is to build it once per NDK with
      # ndk-build. The Vulkan renderer compiles the GLSL it generates into SPIR-V on the device.
      # The instrumentation job also builds the APK for x86_64 (the emulator's ABI), so it needs
      # shaderc for both.
      - name: Build the NDK shaderc that the renderer needs
        run: SCR_SHADERC_ABIS="${{ contains(job.name, 'emulator') && 'arm64-v8a x86_64' || 'arm64-v8a' }}" bash android/ci/build_shaderc.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test disc preparation helper
        run: python3 -m unittest discover -s android/ci -p "test_*.py"
      # std::format is hand-implemented for Android (the NDK's libc++ has none at minSdk 26), so the
      # strings it produces are tested on the host.
      - name: Test the Android std::format implementation
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Iruntime \
            tools/std_format_test/main.cpp -o "$RUNNER_TEMP/std_format_test"
          "$RUNNER_TEMP/std_format_test"
      - name: Build preview APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      # A runner failure is otherwise only "exit code 1": the log is a download, the annotations are
      # the one place the reason reliably reaches a reader, so the important lines go there.
      - name: Report why the build failed
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [ -f "$log" ] || exit 0
          # The line after "CMake Error at ..." carries the message; the list of missing files for
          # an add_library failure sits on the lines after that.
          grep -n -A6 -E "CMake Error" "$log" | head -40 | cut -c1-400 \
            | while IFS= read -r line; do echo "::error::$line"; done
          # A compiler or linker diagnostic is only useful with the lines around it: which target
          # failed, and what the symbol was. -B4 keeps that context, one annotation per block.
          grep -n -B4 -A6 -E "^e: |error:|ld.lld: error|What went wrong|Caused by:" "$log" | head -120 | cut -c1-400 \
            | while IFS= read -r line; do echo "::error::$line"; done
          grep -m8 -E "^e: |error:|What went wrong|Caused by:|FAILURE: Build" "$log" \
            | cut -c1-300 | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 30 "$log" | tr '\n' '|' | cut -c1-4000 | sed 's/^/::error::last lines: /'
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-colors-android-launcher-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  emulator-test:
    runs-on: ubuntu-latest
    # Booting the emulator and building the x86_64 runtime from scratch takes most of this; at 30
    # minutes the run was being cut off, which looked like a test failure and left no report.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android native build dependencies
        run: sdkmanager 'platforms;android-35' 'ndk;26.3.11579264' 'cmake;3.22.1'
      # shaderc is not shipped prebuilt in the NDK; Google's guide is to build it once per NDK with
      # ndk-build. The Vulkan renderer compiles the GLSL it generates into SPIR-V on the device.
      # The instrumentation job also builds the APK for x86_64 (the emulator's ABI), so it needs
      # shaderc for both.
      - name: Build the NDK shaderc that the renderer needs
        run: SCR_SHADERC_ABIS="${{ contains(job.name, 'emulator') && 'arm64-v8a x86_64' || 'arm64-v8a' }}" bash android/ci/build_shaderc.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run launcher and native instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          # -PtestAbis=true adds x86_64 to the APK: the emulator is x86_64, the shipped APK is
          # arm64-v8a, and the two native tests skip (they do not fail) where the library is absent.
          # The output is teed so the next step can annotate the failure, which is the only channel
          # that survives: job logs are not readable from here.
          script: cd android && gradle --no-daemon -PtestAbis=true connectedDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/instrumented.log"
      # A cancelled or failed step reports only "exit code 1" otherwise.
      - name: Report why the instrumentation tests failed
        if: failure()
        run: |
          log="$RUNNER_TEMP/instrumented.log"
          [ -f "$log" ] || { echo "::error::the test step produced no log (was it cancelled?)"; exit 0; }
          grep -n -B2 -A8 -E "FAILED|Tests? on .* failed|junit\.framework|Process crashed|UnsatisfiedLinkError|error:" "$log" \
            | head -120 | cut -c1-400 | while IFS= read -r line; do echo "::error::$line"; done
          # The per-test results say which tests ran and which were skipped, which the summary does
          # not when the run died partway through.
          for xml in android/app/build/outputs/androidTest-results/connected/*.xml; do
            [ -f "$xml" ] || continue
            grep -oE '<testsuite [^>]*>|<testcase [^>]*>|<failure[^>]*>' "$xml" | cut -c1-300 \
              | while IFS= read -r line; do echo "::error::$line"; done
          done
          tail -n 25 "$log" | tr '\n' '|' | cut -c1-4000 | sed 's/^/::error::last lines: /'
          exit 0
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launcher-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/instrumented.log
          if-no-files-found: warn
  game-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_game
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Require a private repository for game-derived artifacts
        if: github.event.repository.private != true
        run: |
          echo 'Use a private repository: this APK contains game-derived code.' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ python3
          sdkmanager 'platforms;android-35' 'ndk;26.3.11579264' 'cmake;3.22.1'
      # shaderc is not shipped prebuilt in the NDK; Google's guide is to build it once per NDK with
      # ndk-build. The Vulkan renderer compiles the GLSL it generates into SPIR-V on the device.
      # The instrumentation job also builds the APK for x86_64 (the emulator's ABI), so it needs
      # shaderc for both.
      - name: Build the NDK shaderc that the renderer needs
        run: SCR_SHADERC_ABIS="${{ contains(job.name, 'emulator') && 'arm64-v8a x86_64' || 'arm64-v8a' }}" bash android/ci/build_shaderc.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and validate owned disc
        env:
          DISC_URL: ${{ secrets.DISC_URL }}
          DISC_SHA256: ${{ secrets.DISC_SHA256 }}
        run: python3 android/ci/download_disc.py "$RUNNER_TEMP/scr-disc"
      - name: Build host disc installer
        run: |
          cmake -S android/ci/installer -B "$RUNNER_TEMP/scr-installer" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/scr-installer" --parallel 2
      - name: Extract supported game and generate recompilation sources
        run: |
          "$RUNNER_TEMP/scr-installer/scr_install" "$RUNNER_TEMP/scr-disc/disc.iso"
          python3 tools/build_generated.py
      - name: Compile and link generated PPC sources into APK
        working-directory: android
        run: gradle --no-daemon --max-workers 2 -PcompileGenerated=true assembleDebug
      - name: Verify both native libraries are packaged
        run: |
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              names = set(apk.namelist())
              for abi in ('arm64-v8a', 'x86_64'):
                  name = f'lib/{abi}/libscr_recomp_code.so'
                  if name not in names:
                      raise SystemExit(f'Missing {name}')
          PYCODE
      - name: Enable KVM for recompiled APK test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test recompiled-code library on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && gradle --no-daemon --max-workers 2 -PcompileGenerated=true connectedDebugAndroidTest
      - name: Upload private code-bearing APK
        uses: actions/upload-artifact@v4
        with:
          name: sonic-colors-android-recompiled-code-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Clean private game data
        if: always()
        run: rm -rf "$RUNNER_TEMP/scr-disc" game generated
